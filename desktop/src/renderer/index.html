<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="style.css">
  <title>Zanda Checkin</title>
</head>
<body>
  <main>
    <h1>Zanda Checkin</h1>
    <p class="muted" id="status"></p>
    <p class="error" id="error" hidden></p>

    <form id="signin" hidden>
      <p>Sign in with your practice's Zanda Checkin account to get a notification when clients arrive.</p>
      <label for="server">Server address</label>
      <input id="server" type="url" placeholder="https://checkin.example.com" required>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
    </form>

    <section id="sites" hidden>
      <p>Signed in to <strong id="org"></strong>. Which site do you want notifications for?</p>
      <div id="site-list" class="site-list"></div>
      <button type="button" id="signout" class="ghost">Sign out</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
