{% extends "portal.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<h1>Account</h1>
<p class="muted">Signed in as {{ user.email }}.</p>
<form method="post" action="/admin/account" class="card">
  <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
  <h2>Change password</h2>
  <label for="current">Current password</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required>
  <div class="row">
    <div><label for="new">New password <small>At least 10 characters</small></label>
      <input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required></div>
    <div><label for="new2">New password again <small>&nbsp;</small></label>
      <input id="new2" name="new2" type="password" autocomplete="new-password" minlength="10" required></div>
  </div>
  <button class="btn btn-primary" type="submit">Change password</button>
</form>
{% endblock %}
