{% extends "base.html" %}
{% block title %}Staff settings{% endblock %}
{% block body %}
<main class="page">
  <p class="eyebrow">Staff only</p>
  <h1>Enter staff PIN</h1>
  {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autofocus required>
    <div class="link-row">
      <button class="btn btn-primary" type="submit">Open settings</button>
      <a class="btn btn-ghost" href="{{ url_for('kiosk') }}" style="display:inline-flex;align-items:center;text-decoration:none">Back to check-in</a>
    </div>
  </form>
</main>
<script>setTimeout(() => { window.location.href = "/"; }, 60000);</script>
{% endblock %}
