<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover{% block viewport_extra %}{% endblock %}">
  <meta name="theme-color" content="#f6f3ee">
  <meta name="format-detection" content="telephone=no">
  {% block head %}{% endblock %}
  <link rel="icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
  <title>{% block title %}Zanda Checkin{% endblock %}</title>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
</body>
</html>
