{% extends "portal.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p class="muted">{{ intro }}</p>
<form method="post" action="{{ action }}" class="card" autocomplete="{{ 'off' if show_code else 'on' }}">
  <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="{{ 'off' if show_code else 'username' }}" value="{{ email }}" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="{{ 'off' if show_code else 'current-password' }}" required>
  <label for="code">Authenticator code <small>{{ "The 6-digit code from your authenticator app, or a recovery code." if show_code else "If you've set up two-step sign-in." }}</small></label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" {% if show_code %}required{% endif %}>
  <div class="link-row">
    <button class="btn btn-primary" type="submit">Sign in</button>
    {% if back %}<a class="btn btn-ghost" href="{{ back }}">Cancel</a>{% endif %}
  </div>
</form>
{% if action == "/login" %}<p class="muted">New practice? <a href="/signup">Create an account</a>.</p>{% endif %}
{% endblock %}
