{% extends "base.html" %}
{% block body %}
<header class="topbar">
  <a class="brand" href="/admin">Zanda Checkin</a>
  {% if user %}
  <nav>
    <a href="/admin">Sites</a>
    <a href="/admin/account">Account</a>
    <form method="post" action="/logout" class="inline-form">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <button class="linklike" type="submit">Sign out</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="page">
  {% if message %}<div class="notice notice-ok" role="status">{{ message }}</div>{% endif %}
  {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="/static/portal.js?v={{ app_version }}"></script>
{% endblock %}
